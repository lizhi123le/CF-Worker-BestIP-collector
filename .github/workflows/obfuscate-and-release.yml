name: 混淆并创建 GitHub 发行版

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 手动触发强制重新混淆并覆盖发布
  schedule:
    - cron: '0 */12 * * *'  # 可保留也可删除，已无实际作用

jobs:
  obfuscate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y zip jq -qq

      - name: 计算 _worker.js.backup 哈希 → 生成 tag
        id: hash
        run: |
          set -euo pipefail
          [ -f "_worker.js.backup" ] || { echo "错误：_worker.js.backup 不存在"; exit 1; }
          FULL_HASH=$(sha256sum "_worker.js.backup" | awk '{print $1}')
          TAG="${FULL_HASH:0:12}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_hash=$FULL_HASH" >> $GITHUB_OUTPUT

      - name: 混淆并打包
        run: |
          cp _worker.js.backup _worker_temp.js
          npm run build -- --input _worker_temp.js --output _worker.js
          rm -f _worker_temp.js _worker.js.temp
          zip -j worker.zip _worker.js

      - name: 提交混淆结果（可选）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js worker.zip
          if git diff --cached --quiet; then
            echo "混淆后无变化，跳过 commit"
          else
            git commit -m "Update obfuscated worker.js (${{ steps.hash.outputs.tag }})"
          fi

      - name: Push 到 main
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # 关键修复：先保证 Release 和 tag 一定存在
      - name: 确保 Release 存在（首次自动创建）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.hash.outputs.tag }}"
          
          # 如果 Release 已存在则直接跳过，不报错
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在"
          else
            echo "首次创建空 Release $TAG"
            gh release create "$TAG" \
              --title "Worker $TAG" \
              --notes "Source hash: ${{ steps.hash.outputs.full_hash }}" \
              --draft=false --prerelease=false
          fi
          
          # 确保 tag 存在并指向最新 commit
          git tag -f "$TAG"
          git push -f origin "$TAG"

      # 真正智能增量上传：只上传有变化的资产
      - name: 智能上传资产（只覆盖改变的文件）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.hash.outputs.tag }}"
          ASSETS=("worker.zip" "_worker.js.backup")

          for asset in "${ASSETS[@]}"; do
            [ -f "$asset" ] || continue

            LOCAL_HASH=$(sha256sum "$asset" | cut -d' ' -f1)

            # 尝试获取远程同名资产的 ID（不存在返回空）
            ASSET_ID=$(gh api "/repos/{owner}/{repo}/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$asset\") | .id" 2>/dev/null || echo "")

            if [ -z "$ASSET_ID" ]; then
              echo "首次上传 → $asset"
              gh release upload "$TAG" "$asset" --clobber
              continue
            fi

            # 获取远程资产下载地址并计算哈希
            REMOTE_URL=$(gh api "/repos/{owner}/{repo}/releases/assets/$ASSET_ID" \
              --jq '.url' | sed 's/^"//;s/"$//')

            REMOTE_HASH=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" "$REMOTE_URL" | sha256sum | cut -d' ' -f1)

            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "检测到变化 → 覆盖上传 $asset"
              gh release upload "$TAG" "$asset" --clobber
            else
              echo "无变化 → 跳过 $asset"
            fi
          done

          echo "Release $TAG 全部处理完成！仅上传了发生变化的文件"
