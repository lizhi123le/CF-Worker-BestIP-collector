name: 混淆并创建 GitHub 发行版

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 手动触发强制重新混淆并覆盖发布
  schedule:
    - cron: '0 */12 * * *'  # 可保留也可删除，已无实际作用
    
jobs:
  obfuscate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y zip jq -qq

      - name: 计算 _worker.js.backup 的哈希并生成 tag
        id: hash
        run: |
          set -euo pipefail
          BACKUP="_worker.js.backup"
          [ -f "$BACKUP" ] || { echo "Error: $BACKUP 不存在！"; exit 1; }
          
          FULL_HASH=$(sha256sum "$BACKUP" | cut -d' ' -f1)
          TAG="${FULL_HASH:0:12}"
          
          echo "Source file : $BACKUP"
          echo "SHA256      : $FULL_HASH"
          echo "Release tag : $TAG"
          
          echo "full_hash=$FULL_HASH" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 从 backup 创建临时文件并混淆
        run: |
          cp _worker.js.backup _worker_temp.js
          npm run build -- --input _worker_temp.js --output _worker.js
          rm -f _worker_temp.js _worker.js.temp

      - name: 打包 worker.zip
        run: |
          zip -j worker.zip _worker.js

      - name: 提交混淆后的 _worker.js 和 zip（仅当有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add _worker.js worker.zip
          
          if git diff --cached --quiet; then
            echo "混淆后文件无变化，跳过 commit"
          else
            git commit -m "Update obfuscated worker.js (${{ steps.hash.outputs.tag }})"
          fi

      - name: Push 到 main
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          
  # 只有在自动检测到更新时才创建 Release（手动触发也创建）
  - name: 创建或覆盖 GitHub Release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      set -euo pipefail
      TAG="${{ steps.hash.outputs.tag }}"

      echo "正在为版本 $VERSION 创建/覆盖 Release..."

      # 删除可能已存在的同名 tag（防止冲突）
      git push origin :refs/tags/$VERSION || true

      # 创建轻量标签并推送到远程
      git tag -f "$VERSION"
      git push -f origin "$VERSION"

      # 使用 gh cli 创建 release（更简洁可靠）
      gh release create "$VERSION" \
        --title "Worker Release $VERSION" \
        --notes "Automated obfuscated release from ethgan/CF-Worker-BestIP-collector" \
        --repo "${{ github.repository }}" \
        worker.zip _worker.js.backup

      echo "Release $VERSION 创建成功并上传资产完成！"
