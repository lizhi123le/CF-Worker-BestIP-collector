name: 混淆并创建 GitHub 发行版

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 手动触发强制重新混淆并覆盖发布
  schedule:
    - cron: '0 */12 * * *'  # 可保留也可删除，已无实际作用
    
jobs:
  obfuscate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y zip jq -qq

      - name: 计算 backup 文件哈希 → 确定 Release tag
        id: hash
        run: |
          set -euo pipefail
          BACKUP="_worker.js.backup"
          [ -f "$BACKUP" ] || { echo "错误：$BACKUP 不存在"; exit 1; }
          
          FULL_HASH=$(sha256sum "$BACKUP" | awk '{print $1}')
          TAG="${FULL_HASH:0:12}"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_hash=$FULL_HASH" >> $GITHUB_OUTPUT

      - name: 混淆 & 打包
        run: |
          cp _worker.js.backup _worker_temp.js
          npm run build -- --input _worker_temp.js --output _worker.js
          rm -f _worker_temp.js _worker.js.temp
          zip -j worker.zip _worker.js

      - name: 提交混淆结果（可选）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js worker.zip
          if git diff --cached --quiet; then
            echo "混淆后无变化，跳过 commit"
          else
            git commit -m "Update obfuscated worker.js (${{ steps.hash.outputs.tag }})"
          fi

      - name: Push 到 main
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # 核心：智能增量覆盖 —— 只上传有变化的资产文件
      - name: 智能上传资产（只覆盖改变的文件）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.hash.outputs.tag }}"

          # 确保 tag 存在（首次会自动创建）
          git tag -f "$TAG" 2>/dev/null || git tag "$TAG"
          git push -f origin "$TAG" || true

          # 定义要上传的资产
          ASSETS=(
            "worker.zip"
            "_worker.js.backup"
          )

          # 遍历每个资产，计算本地哈希 vs 远程已有资产哈希，只上传有变化的
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "跳过不存在的文件: $asset"
              continue
            fi

            LOCAL_HASH=$(sha256sum "$asset" | cut -d' ' -f1)

            # 尝试获取远程同名资产的下载 URL（不存在则返回 404）
            DOWNLOAD_URL=$(gh release view "$TAG" --json assets --jq ".assets[].url" 2>/dev/null | grep -i "/$asset\"" || true)

            if [ -z "$DOWNLOAD_URL" ]; then
              echo "首次上传 → $asset"
              gh release upload "$TAG" "$asset" --clobber
              continue
            fi

            # 下载远程资产并计算哈希（使用 GitHub API 的重定向真实地址）
            REMOTE_HASH=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "$DOWNLOAD_URL" | sha256sum | cut -d' ' -f1)

            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "检测到变化 → 覆盖上传 $asset"
              gh release upload "$TAG" "$asset" --clobber
            else
              echo "无变化 → 跳过 $asset"
            fi
          done

          # 最后确保 Release 存在（如果之前没有任何资产，会自动创建）
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Worker $TAG" --notes "Source hash: ${{ steps.hash.outputs.full_hash }}" ${ASSETS[*]}

          echo "Release $TAG 处理完成！仅上传了发生变化的文件"
