name: 混淆并创建 GitHub 发行版

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 支持手动触发强制全量执行
  schedule:
    - cron: '0 */72 * * *'  # 可保留也可删除，已无实际作用

jobs:
  obfuscate-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y zip jq -qq

      - name: 检查备份文件并创建 _worker_temp.js
        run: |
          set -euo pipefail
          WORKER_FILE="_worker.js"
          BACKUP_FILE="_worker.js.backup"
          TEMP_FILE="_worker_temp.js"
          
          # 确保 _worker.js.backup 存在（这是我们唯一的源文件）
          if [ ! -f "$BACKUP_FILE" ]; then
            echo "Error: $BACKUP_FILE does not exist in $(pwd)"
            ls -la
            exit 1
          fi
          
          # 从备份创建临时文件进行混淆
          cp "$BACKUP_FILE" "$TEMP_FILE" || {
            echo "Error: Failed to create $TEMP_FILE from $BACKUP_FILE"
            exit 1
          }
          
          echo "$TEMP_FILE created successfully from $BACKUP_FILE"
          ls -la

      - name: 混淆代码
        run: |
          npm run build -- --input _worker_temp.js --output _worker.js
          rm -f _worker.js.temp _worker_temp.js

      - name: 打包为 worker.zip
        run: |
          zip -j worker.zip _worker.js

      - name: 提交混淆后的代码和备份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _worker.js _worker.js.backup worker.zip
          
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
          else
            VERSION="release-$(date +%Y%m%d-%H%M%S)"
            git commit -m "Auto obfuscate & release (v${VERSION})"
          fi

      - name: Push 更改到 main 分支
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: 创建或覆盖 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="release-$(date +%Y%m%d-%H%M%S)"

          echo "正在为版本 $VERSION 创建/覆盖 Release..."

          # 删除可能已存在的同名 tag
          git push origin :refs/tags/$VERSION || true

          # 创建并强制推送 tag
          git tag -f "$VERSION"
          git push -f origin "$VERSION"

          # 创建 release 并上传资产
          gh release create "$VERSION" \
            --title "Worker Release $VERSION" \
            --notes "Automated obfuscated release (local source only, no upstream sync)" \
            --repo "${{ github.repository }}" \
            worker.zip _worker.js.backup

          echo "Release $VERSION 创建成功并上传资产完成！"
